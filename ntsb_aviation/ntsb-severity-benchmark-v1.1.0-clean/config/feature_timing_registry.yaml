version: 0.3.0
features:
  acft_year:
    current_declared_type: numeric
    recommended_model_type: derived age
    source: aircraft
    dictionary_basis: acft_year
    timing_window: Pre-event/static or event-time observation
    decision: Retain—core
    confidence: Medium
    preprocessing: Replace raw manufacture year with aircraft age at event.
    note: Dictionary supplies only the meaning 'Year of Manufacture'; use aircraft
      age at event rather than raw calendar year.
  afm_hrs:
    current_declared_type: numeric
    recommended_model_type: numeric
    source: aircraft
    dictionary_basis: afm_hrs
    timing_window: Early record enrichment; not guaranteed at initial notification
    decision: Retain—conditional
    confidence: Medium
    preprocessing: Include in an enriched early-record model and a strict-model sensitivity
      analysis; fit all preprocessing on training data only.
    note: Interpret jointly with afm_hrs_since because total hours may be measured
      at last inspection or at the accident.
