project:
  name: ntsb-severity-benchmark
  random_seed: 42

data:
  events_file: events.xlsx
  events_sheet: events
  aircraft_file: aircraft.xlsx
  aircraft_sheet: aircraft
  aircraft_duplicate_sheet: aircraft1
  crew_file: Flight_Crew.xlsx
  crew_sheet: Flight_Crew
  findings_file: Findings.xlsx
  findings_sheet: Findings

cohort:
  start_year: 2008
  end_year: 2025
  primary_aircraft_key: "1"
  crew_rule: aggregate_all_crew_for_selected_primary_aircraft

outcome:
  fatal_column: inj_tot_f
  serious_column: inj_tot_s
  positive_label: 1

validation:
  random_test_size: 0.20
  development_size_within_training: 0.10
  primary_temporal_cut: 2019
  rolling_temporal_cuts: [2017, 2019, 2021]
  bootstrap_repetitions: 1000
  default_threshold: 0.50
  target_max_fnr: 0.20
  probability_adjustment: prior_correction_after_random_oversampling

models:
  logistic_regression:
    C: 0.5
    max_iter: 1000
    penalty: l2
  random_forest:
    n_estimators: 120
    max_depth: 20
    min_samples_leaf: 2
    n_jobs: 4
  xgboost:
    n_estimators: 120
    max_depth: 5
    learning_rate: 0.08
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
    n_jobs: 4

reporting:
  shap_sample_size: 2000
  subgroup_column: far_part
  subgroup_min_severe: 39
