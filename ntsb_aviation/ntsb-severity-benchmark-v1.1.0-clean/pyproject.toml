[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntsb-severity-benchmark"
version = "1.0.0"
description = "Leakage-controlled temporal validation benchmark for NTSB aviation severity prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Elahe Oveisi"}]
dependencies = [
  "lxml>=4.9",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "imbalanced-learn>=0.11",
  "xgboost>=2.0",
  "shap>=0.44",
  "matplotlib>=3.7",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
ntsb-severity = "ntsb_severity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
